<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TAKEVMUN konferansına delege olarak başvurun. Apply for the TAKEVMUN conference as a delegate.">
    <title>TAKEVMUN - Başvurular</title>
    <link rel="icon" type="image/png" href="/res/logo-small.png">
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/navbar.css">
    <link rel="stylesheet" href="style/popup.css">
    <link rel="stylesheet" href="style/applications.css">
</head>
<body>
    <div class="navbar">
        <div class="logo"><a href="index.html"><img src="res/logo.webp"></a></div>

        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="tabs" id="nav-tabs">
            <a href="committees.html">Komiteler</a>
            <a href="applications.html">Başvurular</a>
            <a href="team.html">Ekibimiz</a>
            <a href="guides.html">Çalışma Rehberleri</a>
        </div>

        <div class="notification-wrapper">
            <button class="notification-btn" id="notificationBtn" aria-label="Notifications">
                <svg class="megaphone-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 4.5L5.5 9.5H3a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h2.5L17 19.5V4.5Z" fill="currentColor" stroke="none"></path>
                    <path d="M6.5 14.5l1.3 3.7a1.1 1.1 0 0 0 2.1-.7L8.7 14.5"></path>
                    <line x1="18.8" y1="7.5" x2="21.2" y2="5.2"></line>
                    <line x1="19.6" y1="12" x2="22.5" y2="12"></line>
                    <line x1="18.8" y1="16.5" x2="21.2" y2="18.8"></line>
                </svg>
                <span class="unread-dot" id="unreadDot"></span>
            </button>

            <div class="notification-dropdown" id="notificationDropdown">
                <div class="notification-header">
                    <span>Duyurular</span>
                    <button class="mark-all-read" id="markAllReadBtn">Tümünü Okundu İşaretle</button>
                </div>
                <div class="notification-list" id="notificationList"></div>
            </div>
        </div>
    </div>

    <a href="https://apply.takevmun.com" target="_blank"><div class="application-text">
        Delege olarak başvurmak için buraya tıklayın.
    </div></a>

    <div id="instagram-popup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <button class="popup-close" id="close-popup">&times;</button>
            <h2>Instagram hesabımızı takip edin!</h2>
            <p>Güncellemeleri kaçırmamak için bizi Instagram'da <b>@takevmunofficial</b> kullanıcı adıyla takip edebilirsiniz.</p>
            <a href="https://www.instagram.com/takevmunofficial/" target="_blank" class="popup-btn">Takip Et</a>
        </div>
    </div>

    <script src="script/global.js"></script>
    <script src="script/notify.js"></script>
</body>
</html>
