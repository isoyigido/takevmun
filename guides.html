<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TAKEVMUN konferansı resmî internet sayfası.">
    <title>TAKEVMUN - Çalışma Rehberleri</title>
    <link rel="icon" type="image/x-icon" href="res/logo.webp">
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/navbar.css">
    <link rel="stylesheet" href="style/popup.css">
</head>
<body>
    <div class="navbar">
        <div class="logo"><a href="index.html"><img src="res/logo.webp"></a></div>

        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="tabs" id="nav-tabs">
            <a href="committees.html">Komiteler</a>
            <a href="applications.html">Başvurular</a>
            <a href="team.html">Ekibimiz</a>
            <a href="guides.html">Çalışma Rehberleri</a>
        </div>

        <div class="notification-wrapper">
            <button class="notification-btn" id="notificationBtn" aria-label="Notifications">
                <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="unread-dot" id="unreadDot"></span>
            </button>

            <div class="notification-dropdown" id="notificationDropdown">
                <div class="notification-header">
                    <span>Bildirimler</span>
                    <button class="mark-all-read" id="markAllReadBtn">Tümünü Okundu İşaretle</button>
                </div>
                <div class="notification-list" id="notificationList"></div>
            </div>
        </div>
    </div>

    <div class="temporary-text">
        Çalışma rehberleri henüz paylaşılmamıştır.
    </div>

    <div id="instagram-popup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <button class="popup-close" id="close-popup">&times;</button>
            <h2>Instagram hesabımızı takip edin!</h2>
            <p>Güncellemeleri kaçırmamak için bizi Instagram'da <b>@takevmunofficial</b> kullanıcı adıyla takip edebilirsiniz.</p>
            <a href="https://www.instagram.com/takevmunofficial/" target="_blank" class="popup-btn">Takip Et</a>
        </div>
    </div>

    <script src="script/global.js"></script>
    <script src="script/notify.js"></script>
